<main class="app-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">Lusi v1.0</p>
      <h1>Radni prostor za blockchain forenziku</h1>
      <p class="subtitle">Učitajte dokaze, pregledajte grafove transakcija i izvezite izveštaje sa jedne konzole.</p>
    </div>
    <nav class="topbar-nav" *ngIf="auth.currentUser$ | async as user">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Kontrolna tabla</a>
      <a routerLink="/cases" routerLinkActive="active">Slučajevi</a>
      <a routerLink="/graph" routerLinkActive="active">Graf</a>
      <a routerLink="/taint" routerLinkActive="active">Taint analiza</a>
      <a routerLink="/pathfinding" routerLinkActive="active">Pathfinding</a>
      <a routerLink="/reports" routerLinkActive="active">Izveštaji</a>
      <a routerLink="/verify-report" routerLinkActive="active">Provera izveštaja</a>
      <a routerLink="/activity-log" routerLinkActive="active">Log</a>
      <a routerLink="/lanac-dokaza" routerLinkActive="active">Lanac dokaza</a>
      <a routerLink="/tests" routerLinkActive="active" *ngIf="user.role === 'admin'">Testovi</a>
      <a routerLink="/admin/users" routerLinkActive="active" *ngIf="user.role === 'admin'">Administracija</a>
      <span class="user-chip">{{ user.username }}</span>
      <button type="button" class="logout-button" (click)="logout()">Odjava</button>
    </nav>
  </header>

  <section class="workspace">
    <router-outlet></router-outlet>
  </section>
</main>
