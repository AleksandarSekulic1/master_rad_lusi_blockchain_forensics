<main class="app-shell">
  <header class="topbar">
    <div class="topbar-top">
      <div class="brand">
        <img class="brand-mark" src="assets/cat.png" alt="Lusi" />
        <div class="brand-text">
          <p class="eyebrow">Lusi v1.0</p>
          <h1>
            {{
              settings.lang() === 'sr'
                ? 'Digitalna forenzika blockchain transakcija'
                : 'Digital forensics of blockchain transactions'
            }}
          </h1>
        </div>
      </div>
      <div class="session">
        <!-- Tema/jezik su podesivi i pre prijave (na /login) - preferencija je per-uređaj,
             ne per-nalog, pa nema razloga da čeka na ulogovanog korisnika. -->
        <div class="prefs" role="group" aria-label="Podešavanja">
          <button
            type="button"
            class="pref-toggle"
            (click)="settings.toggleTheme()"
            [title]="settings.theme() === 'dark' ? 'Svetla tema' : 'Tamna tema'"
            [attr.aria-label]="settings.theme() === 'dark' ? 'Uključi svetlu temu' : 'Uključi tamnu temu'"
          >
            <span aria-hidden="true">{{ settings.theme() === 'dark' ? '☀' : '☾' }}</span>
          </button>
          <button
            type="button"
            class="pref-toggle pref-lang"
            (click)="settings.toggleLang()"
            [title]="settings.lang() === 'sr' ? 'English' : 'Srpski'"
            [attr.aria-label]="settings.lang() === 'sr' ? 'Switch to English' : 'Prebaci na srpski'"
          >
            {{ settings.lang() === 'sr' ? 'EN' : 'SR' }}
          </button>
        </div>
        <ng-container *ngIf="auth.currentUser$ | async as user">
          <span class="user-chip">{{ user.username }}</span>
          <button type="button" class="logout-button" (click)="logout()">
            {{ settings.lang() === 'sr' ? 'Odjava' : 'Log out' }}
          </button>
        </ng-container>
      </div>
    </div>
    <nav class="topbar-nav" *ngIf="auth.currentUser$ | async as user">
      <ng-container *ngFor="let item of navItems">
        <a
          *ngIf="!item.adminOnly || user.role === 'admin'"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
        >{{ settings.lang() === 'sr' ? item.sr : item.en }}</a>
      </ng-container>
    </nav>
  </header>

  <section class="workspace">
    <router-outlet></router-outlet>
  </section>
</main>
