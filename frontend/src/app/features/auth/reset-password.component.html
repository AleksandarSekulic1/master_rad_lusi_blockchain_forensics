<section class="auth-shell">
  <article class="auth-card">
    <p class="eyebrow">Lusi v1.0</p>
    <h1>{{ t('Nova lozinka', 'New password') }}</h1>
    <p class="subtitle">{{ t('Unesite novu lozinku za vaš nalog.', 'Enter a new password for your account.') }}</p>

    <form class="auth-form" (ngSubmit)="submit()" *ngIf="!successMessage">
      <label>
        {{ t('Nova lozinka', 'New password') }}
        <input [(ngModel)]="newPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="••••••••" />
      </label>
      <label>
        {{ t('Potvrdite lozinku', 'Confirm password') }}
        <input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="••••••••" />
      </label>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" class="primary-button" [disabled]="isSubmitting || !token">
        {{ isSubmitting ? t('Čuvanje...', 'Saving...') : t('Sačuvaj novu lozinku', 'Save new password') }}
      </button>
    </form>

    <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
  </article>
</section>
