services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:4200
      FRONTEND_URL: http://localhost:4200
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      # Graf baza (Neo4j) - opcioni, dodatni sloj samo za case_graph_search (napredna
      # pretraga grafa). Ako nije dostupna, ostatak aplikacije radi normalno dalje.
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-dev-insecure-password}
    depends_on:
      - neo4j

  # Graf baza za case_graph_search (napredna pretraga grafa - susedstvo adrese do N
  # koraka preko Cypher upita). Odvojena od primarne persistencije (JSON + CSV dokazi
  # ostaju izvor istine) - vidi PREDLOG-GRAF-SUBP.md.
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474" # Neo4j Browser (http://localhost:7474) - korisno za demo/Cypher upite uživo
      - "7687:7687" # Bolt protokol - ovim se backend povezuje
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-dev-insecure-password}
    volumes:
      - neo4j_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  neo4j_data:
